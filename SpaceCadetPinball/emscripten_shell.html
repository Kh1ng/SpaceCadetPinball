<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Pinball for Windows - Space Cadet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
    <style>
        /* Based on https://tpenguinltg.github.io/winclassic/ */
        :root {
            --ActiveBorder: rgb(212, 208, 200);
            --ActiveTitle: rgb(10, 36, 106);
            --AppWorkspace: rgb(128, 128, 128);
            --Background: rgb(58, 110, 165);
            --ButtonAlternateFace: rgb(192, 192, 192);
            --ButtonDkShadow: rgb(64, 64, 64);
            --ButtonFace: rgb(212, 208, 200);
            --ButtonHilight: rgb(255, 255, 255);
            --ButtonLight: rgb(212, 208, 200);
            --ButtonShadow: rgb(128, 128, 128);
            --ButtonText: rgb(0, 0, 0);
            --GradientActiveTitle: rgb(166, 202, 240);
            --GradientInactiveTitle: rgb(192, 192, 192);
            --GrayText: rgb(128, 128, 128);
            --Hilight: rgb(10, 36, 106);
            --HilightText: rgb(255, 255, 255);
            --HotTrackingColor: rgb(0, 0, 128);
            --InactiveBorder: rgb(212, 208, 200);
            --InactiveTitle: rgb(128, 128, 128);
            --InactiveTitleText: rgb(212, 208, 200);
            --InfoText: rgb(0, 0, 0);
            --InfoWindow: rgb(255, 255, 225);
            --Menu: rgb(212, 208, 200);
            --MenuBar: rgb(192, 192, 192);
            --MenuHilight: rgb(0, 0, 128);
            --MenuText: rgb(0, 0, 0);
            --Scrollbar: rgb(212, 208, 200);
            --TitleText: rgb(255, 255, 255);
            --Window: rgb(255, 255, 255);
            --WindowFrame: rgb(0, 0, 0);
            --WindowText: rgb(0, 0, 0);
        }

        body {
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--Background);
            text-align: center;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        textarea.emscripten {
            font-family: monospace;
            width: 80%;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            width: 100% !important;
            height: auto !important;
            image-rendering: pixelated;
            display: block;
        }

        .titlebar {
            text-align: start;
            margin: 0px;
            padding: 1px;
            position: relative;
            overflow: hidden;
            display: flex;
            user-select: none;
        }

        .titlebar .titlebar-icon {
            width: 16px;
            height: 16px;
            padding: 1px;
        }

        .titlebar .titlebar-title {
            display: flex;
            padding: 0px 2px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-weight: bold;
            align-items: center;
        }

        .titlebar .titlebar-wincontrols {
            display: inline-block;
            margin: 0px;
            padding: 1px;
            min-width: fit-content;
        }

        .titlebar-wincontrols .buttons-wrapper {
            display: inline-block;
            width: auto;
            margin: 0px;
            padding: 1px;
        }

        .titlebar-wincontrols .spacer {
            display: inline-block;
            margin: 0px;
            padding: 0px;
            width: 2px;
        }

        .titlebar-wincontrols .button {
            display: inline-block;
            min-width: 12px;
            min-height: 10px;
            width: 12px;
            height: 10px;
            text-align: center;
            vertical-align: middle;
            line-height: 10px;
        }

        .window {
            font-size: 8pt;
            color: var(--WindowText);
            background-color: var(--ButtonFace);
            border: 1px solid var(--ActiveBorder);
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonHilight), 0px 0px 0px 1px var(--ButtonShadow), -0.5px -0.5px 0px 1.5px var(--ButtonLight), 0px 0px 0px 2px var(--ButtonDkShadow);
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            max-width: 900px;
        }

        .window.active {
            border: 1px solid var(--ActiveBorder);
        }

        .window.active .titlebar .titlebar-icon {
            background-color: var(--ActiveTitle);
            color: var(--TitleText);
        }

        .window.active .titlebar .titlebar-title {
            background-color: var(--ActiveTitle);
            background-image: linear-gradient(to right, var(--ActiveTitle), var(--GradientActiveTitle));
            color: var(--TitleText);
        }

        .window.active .titlebar .titlebar-wincontrols,
        .window.active .titlebar .titlebar-wincontrols .buttons-wrapper {
            background-color: var(--GradientActiveTitle);
            font-size: 8pt;
            font-weight: bold;
        }

        .button {
            margin: 2px;
        }

        .button span.button-content {
            display: inline-block;
        }

        .button:active .button-content {
            transform: translate(1px, 1px);
        }

        .button {
            background-color: var(--ButtonFace);
            color: var(--ButtonText);
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonLight), 0px 0px 0px 1px var(--ButtonShadow), -0.5px -0.5px 0px 1.5px var(--ButtonHilight), 0px 0px 0px 2px var(--ButtonDkShadow);
        }

        .button:active {
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonShadow), 0px 0px 0px 1px var(--ButtonShadow), -0.5px -0.5px 0px 1.5px var(--WindowFrame), 0px 0px 0px 2px var(--WindowFrame);
        }

        .button svg path {
            fill: var(--ButtonText);
        }

        .titlebar .button:active {
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonShadow), 0px 0px 0px 1px var(--ButtonLight), -0.5px -0.5px 0px 1.5px var(--ButtonDkShadow), 0px 0px 0px 2px var(--ButtonHilight);
        }

        #status {
            margin: 40px 32px;
        }

        /* ---- Auth overlay ---- */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--Background);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 60px;
            z-index: 100;
            pointer-events: all;
            /* Allow the overlay to scroll when the soft keyboard pushes content up */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #auth-overlay.hidden {
            display: none;
            pointer-events: none;
        }

        #auth-box {
            width: 280px;
            text-align: left;
        }

        #auth-box .window-body {
            padding: 12px 14px 14px;
        }

        #auth-box label {
            display: block;
            margin-top: 8px;
            margin-bottom: 2px;
            font-size: 8pt;
        }

        #auth-box input[type=text],
        #auth-box input[type=password] {
            width: 100%;
            box-sizing: border-box;
            font-size: 8pt;
            border: 1px solid var(--ButtonDkShadow);
            box-shadow: inset 1px 1px 0px var(--ButtonShadow);
            padding: 2px 4px;
            background: white;
        }

        #auth-box .btn-row {
            display: flex;
            gap: 4px;
            margin-top: 12px;
            justify-content: flex-end;
        }

        #auth-box button {
            font-family: inherit;
            font-size: 8pt;
            padding: 2px 12px;
            cursor: pointer;
            background-color: var(--ButtonFace);
            color: var(--ButtonText);
            border: none;
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonLight), 0px 0px 0px 1px var(--ButtonShadow),
                        -0.5px -0.5px 0px 1.5px var(--ButtonHilight), 0px 0px 0px 2px var(--ButtonDkShadow);
        }

        #auth-box button:active {
            box-shadow: -0.5px -0.5px 0px 0.5px var(--ButtonShadow), 0px 0px 0px 1px var(--ButtonShadow),
                        -0.5px -0.5px 0px 1.5px var(--WindowFrame), 0px 0px 0px 2px var(--WindowFrame);
        }

        #auth-error {
            color: #c00;
            font-size: 8pt;
            margin-top: 6px;
            min-height: 1em;
        }

        #auth-toggle {
            margin-top: 8px;
            font-size: 8pt;
            text-align: center;
        }

        #auth-toggle a {
            color: var(--HotTrackingColor);
            cursor: pointer;
            text-decoration: underline;
        }

        /* User info lives in the title bar right side, replacing window controls */
        #user-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            font-size: 8pt;
            color: var(--TitleText);
            white-space: nowrap;
        }

        #user-bar a {
            color: #cdf;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ---- Mobile layout ---- */
        @media (max-width: 600px) {
            body {
                padding: 4px;
            }
            .window {
                max-width: 100%;
            }
            /* iOS Safari zooms in on inputs smaller than 16px even with
               user-scalable=no, causing the viewport to scroll out from
               under the fixed overlay. Force 16px to suppress that. */
            #auth-box input[type=text],
            #auth-box input[type=password] {
                font-size: 16px;
            }
        }

        /* ---- Mobile touch overlay ---- */
        #canvas-wrap {
            position: relative;
            display: block;
            line-height: 0;
        }

        #touch-overlay {
            display: none; /* shown via JS when touch device detected */
            position: absolute;
            inset: 0;
            z-index: 5;
            touch-action: none; /* prevent browser scroll/zoom on the canvas */
        }

        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            /* Transparent — just captures touch events */
        }

        #touch-left  { left: 0; }
        #touch-right { left: 50%; }

        #touch-help-btn {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.45);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 14px;
            cursor: pointer;
            line-height: 28px;
            text-align: center;
            padding: 0;
            z-index: 6;
            display: none; /* shown with overlay */
        }

        #touch-help-popup {
            display: none;
            position: absolute;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 11px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 7;
            pointer-events: none;
        }

        #touch-help-popup.visible { display: block; }
    </style>
</head>

<body>
    <!-- Auth overlay -->
    <div id="auth-overlay">
        <div id="auth-box" class="window active">
            <div class="titlebar">
                <span class="titlebar-title" id="auth-title">Sign In</span>
            </div>
            <div class="window-body">
                <label for="auth-username">Username</label>
                <input type="text" id="auth-username" maxlength="20" autocomplete="username" />
                <label for="auth-password">Password</label>
                <input type="password" id="auth-password" maxlength="128" autocomplete="current-password" />
                <div id="auth-error"></div>
                <div class="btn-row">
                    <button id="auth-submit">OK</button>
                </div>
                <div id="auth-toggle">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <a id="auth-toggle-link">Create one</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Game window (always in DOM so Emscripten canvas is accessible at init) -->
    <div class="window active" id="game-window">
        <div class="titlebar">
            <span class="titlebar-title">3D Pinball for Windows - Space Cadet</span>
            <div id="user-bar">
                <span>Signed in as&nbsp;<strong id="user-bar-name"></strong></span>
                <a id="sign-out-link">Sign out</a>
            </div>
        </div>
        <div class="emscripten" id="status">Downloading...</div>
        <div class="emscripten">
            <progress value="0" max="100" id="progress" hidden=1></progress>
        </div>
        <div id="canvas-wrap">
            <canvas class="emscripten" id="canvas" style="display:none;" oncontextmenu="event.preventDefault()"
                tabindex="-1"></canvas>
            <!-- Mobile touch zones -->
            <div id="touch-overlay">
                <div class="touch-zone" id="touch-left"></div>
                <div class="touch-zone" id="touch-right"></div>
            </div>
            <button id="touch-help-btn" title="Touch controls help">?</button>
            <div id="touch-help-popup">
                👈 Left half — Left flipper<br>
                👉 Right half — Right flipper<br>
                ✌️ 2 fingers — Launch ball<br>
                🤚 3 fingers — Pause / Resume
            </div>
        </div>
    </div>

    <script type='text/javascript'>
        // ---------------------------------------------------------------------------
        // Auth state
        // ---------------------------------------------------------------------------
        var _pinballToken = null;
        var _pinballUser  = null;

        var API_URL = 'https://pinball-api.coltonspurgin.tech';

        function loadSession() {
            try {
                var t = localStorage.getItem('pinball_token');
                var u = localStorage.getItem('pinball_user');
                if (t && u) { _pinballToken = t; _pinballUser = u; return true; }
            } catch(e) {}
            return false;
        }

        function saveSession(token, username) {
            _pinballToken = token;
            _pinballUser  = username;
            try {
                localStorage.setItem('pinball_token', token);
                localStorage.setItem('pinball_user', username);
            } catch(e) {}
        }

        function clearSession() {
            _pinballToken = null;
            _pinballUser  = null;
            try { localStorage.removeItem('pinball_token'); localStorage.removeItem('pinball_user'); } catch(e) {}
        }

        // ---------------------------------------------------------------------------
        // Auth UI
        // ---------------------------------------------------------------------------
        var isRegisterMode = false;

        document.getElementById('auth-toggle-link').addEventListener('click', function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').textContent     = isRegisterMode ? 'Create Account' : 'Sign In';
            document.getElementById('auth-submit').textContent    = isRegisterMode ? 'Create Account' : 'OK';
            document.getElementById('auth-toggle-text').textContent = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('auth-toggle-link').textContent = isRegisterMode ? 'Sign in' : 'Create one';
            document.getElementById('auth-error').textContent = '';
            document.getElementById('auth-password').autocomplete = isRegisterMode ? 'new-password' : 'current-password';
        });

        document.getElementById('auth-submit').addEventListener('click', doAuth);
        document.getElementById('auth-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doAuth();
        });

        function doAuth() {
            var username = document.getElementById('auth-username').value.trim();
            var password = document.getElementById('auth-password').value;
            var errEl    = document.getElementById('auth-error');
            errEl.textContent = '';

            if (!username || !password) { errEl.textContent = 'Please fill in all fields.'; return; }

            var endpoint = isRegisterMode ? '/register' : '/login';
            document.getElementById('auth-submit').disabled = true;

            fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
            .then(function(res) {
                document.getElementById('auth-submit').disabled = false;
                if (!res.ok) { errEl.textContent = res.data.error || 'Error'; return; }
                saveSession(res.data.token, res.data.username);
                startGame();
            })
            .catch(function(e) {
                document.getElementById('auth-submit').disabled = false;
                errEl.textContent = 'Could not reach server. Try again.';
            });
        }

        document.getElementById('sign-out-link').addEventListener('click', function() {
            clearSession();
            location.reload();
        });

        function startGame() {
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('user-bar-name').textContent = _pinballUser;
        }

        // ---------------------------------------------------------------------------
        // Module scaffolding (needs to exist before SpaceCadetPinball.js loads)
        // ---------------------------------------------------------------------------
        var statusElement  = document.getElementById('status');
        var progressElement = document.getElementById('progress');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                    progressElement.value = parseInt(m[2]) * 100;
                    progressElement.max   = parseInt(m[4]) * 100;
                    progressElement.hidden = false;
                } else {
                    progressElement.value = null;
                    progressElement.max   = null;
                    progressElement.hidden = true;
                    var canvas = document.getElementById('canvas');
                    canvas.style.display = "";
                }
                statusElement.innerHTML = text;
                if (text === "") {
                    statusElement.style.display  = "none";
                    progressElement.style.display = "none";
                } else {
                    statusElement.style.display  = "";
                    progressElement.style.display = "";
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        window.onerror = function () {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function (text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };

        // ---------------------------------------------------------------------------
        // Boot: check existing session, else show auth form
        // ---------------------------------------------------------------------------
        if (loadSession()) {
            startGame();
        }
        // else: auth overlay is already visible; startGame() called after login
    </script>
    <script>
        // ---------------------------------------------------------------------------
        // Mobile touch controls
        // ---------------------------------------------------------------------------
        (function() {
            var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isTouchDevice) return;

            var overlay  = document.getElementById('touch-overlay');
            var helpBtn  = document.getElementById('touch-help-btn');
            var helpPop  = document.getElementById('touch-help-popup');
            overlay.style.display = 'block';
            helpBtn.style.display = 'block';

            // Toggle help popup
            helpBtn.addEventListener('touchstart', function(e) {
                e.stopPropagation();
                e.preventDefault();
                helpPop.classList.toggle('visible');
            }, { passive: false });
            // Hide popup when touching game area
            overlay.addEventListener('touchstart', function() {
                helpPop.classList.remove('visible');
            }, { passive: true });

            // Key helpers
            function fireKey(type, key, code, keyCode) {
                var evt = new KeyboardEvent(type, {
                    key: key, code: code,
                    keyCode: keyCode || (key.charCodeAt ? key.charCodeAt(0) : 0),
                    which:   keyCode || (key.charCodeAt ? key.charCodeAt(0) : 0),
                    bubbles: true, cancelable: true
                });
                document.dispatchEvent(evt);
            }

            // Track active keys so we can release them
            var activeKeys = {}; // touchId -> key fired

            // Resume AudioContext on first touch (mobile browsers suspend it until a gesture)
            document.addEventListener('touchstart', function resumeAudio() {
                try {
                    // Emscripten SDL2 stores the audio context here
                    if (typeof SDL2 !== 'undefined' && SDL2.audioContext && SDL2.audioContext.state === 'suspended') {
                        SDL2.audioContext.resume();
                    }
                    // Also try any AudioContext the page may have created
                    if (window._sdlAudioCtx && window._sdlAudioCtx.state === 'suspended') {
                        window._sdlAudioCtx.resume();
                    }
                } catch(e) {}
                document.removeEventListener('touchstart', resumeAudio);
            }, { passive: true });

            // Determine which logical key a touch point maps to using position math.
            // keyCode must match the DOM standard values SDL2/Emscripten maps from:
            //   Z key → keyCode 90, / key → keyCode 191
            function zoneKey(touch) {
                var rect = overlay.getBoundingClientRect();
                if (touch.clientX < rect.left || touch.clientX > rect.right) return null;
                if (touch.clientX - rect.left < rect.width / 2) {
                    return { key: 'z', code: 'KeyZ', keyCode: 90 };
                } else {
                    return { key: '/', code: 'Slash', keyCode: 191 };
                }
            }

            function handleTouchStart(e) {
                e.preventDefault();
                var touches = e.touches;
                var count = touches.length;

                if (count === 2) {
                    // Release any single-finger keys first
                    releaseAll();
                    fireKey('keydown', ' ', 'Space');
                    activeKeys['__space'] = { key: ' ', code: 'Space' };
                    return;
                }
                if (count === 3) {
                    releaseAll();
                    fireKey('keydown', 'F3', 'F3');
                    activeKeys['__f3'] = { key: 'F3', code: 'F3' };
                    return;
                }
                if (count > 3) return;

                // Single touch — only handle the new touch (changedTouches)
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var t = e.changedTouches[i];
                    var k = zoneKey(t);
                    if (k && !activeKeys[t.identifier]) {
                        fireKey('keydown', k.key, k.code, k.keyCode);
                        activeKeys[t.identifier] = k;
                    }
                }
            }

            function handleTouchEnd(e) {
                e.preventDefault();
                var count = e.touches.length;

                // Release multi-finger virtual keys when finger count drops
                if (activeKeys['__space'] && count < 2) {
                    fireKey('keyup', ' ', 'Space');
                    delete activeKeys['__space'];
                }
                if (activeKeys['__f3'] && count < 3) {
                    fireKey('keyup', 'F3', 'F3');
                    delete activeKeys['__f3'];
                }

                for (var i = 0; i < e.changedTouches.length; i++) {
                    var id = e.changedTouches[i].identifier;
                    if (activeKeys[id]) {
                        fireKey('keyup', activeKeys[id].key, activeKeys[id].code, activeKeys[id].keyCode);
                        delete activeKeys[id];
                    }
                }
            }

            function releaseAll() {
                for (var id in activeKeys) {
                    fireKey('keyup', activeKeys[id].key, activeKeys[id].code, activeKeys[id].keyCode);
                }
                activeKeys = {};
            }

            overlay.addEventListener('touchstart', handleTouchStart, { passive: false });
            overlay.addEventListener('touchend',   handleTouchEnd,   { passive: false });
            overlay.addEventListener('touchcancel',handleTouchEnd,   { passive: false });
        })();

        // SDL2+Emscripten calls emscripten_set_element_css_size() at initRuntime with
        // a canvas ID string read from WASM linear memory. In some builds the pointer
        // is garbage, which causes document.querySelector() to throw a DOMException and
        // crash the module. Since we handle canvas sizing via CSS (width:100%),
        // we can safely swallow the bad-selector error here.
        (function() {
            var _qs = document.querySelector.bind(document);
            document.querySelector = function(sel) {
                try { return _qs(sel); } catch(e) { return null; }
            };
        })();
    </script>
    {{{ SCRIPT }}}
</body>

</html>
