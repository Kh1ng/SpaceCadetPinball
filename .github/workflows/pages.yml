name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: .emsdk-cache
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Cache game data
        id: cache-game
        uses: actions/cache@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: game_resources
          key: pinball-game-data-v1

      - name: Fetch game data
        if: steps.cache-game.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y p7zip-full
          curl -L "https://archive.org/download/3-d-pinball-for-windows.-7z/3D%20Pinball%20for%20Windows.7z" -o pinball.7z
          7z x pinball.7z -ogame_resources
          rm pinball.7z

      - name: Configure
        run: |
          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEADERBOARD_SECRET="${{ secrets.LEADERBOARD_SECRET }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage site
        run: |
          mkdir -p _site
          # Append short git SHA to all build artifacts so the browser cache
          # can never serve mismatched files from different builds
          SHA=$(git rev-parse --short HEAD)
          cp bin/SpaceCadetPinball.js   "_site/SpaceCadetPinball.${SHA}.js"
          cp bin/SpaceCadetPinball.wasm "_site/SpaceCadetPinball.${SHA}.wasm"
          cp bin/SpaceCadetPinball.data "_site/SpaceCadetPinball.${SHA}.data"
          # Patch the JS loader (contains .wasm and .data references) and HTML
          sed -i "s/SpaceCadetPinball\.wasm/SpaceCadetPinball.${SHA}.wasm/g; \
                  s/SpaceCadetPinball\.data/SpaceCadetPinball.${SHA}.data/g" \
            "_site/SpaceCadetPinball.${SHA}.js"
          sed "s/SpaceCadetPinball\.js/SpaceCadetPinball.${SHA}.js/g" \
            bin/SpaceCadetPinball.html > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
