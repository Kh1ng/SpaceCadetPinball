name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: .emsdk-cache

      - name: Cache game data
        id: cache-game
        uses: actions/cache@v4
        with:
          path: game_resources
          key: pinball-game-data-v1

      - name: Fetch game data
        if: steps.cache-game.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y p7zip-full
          curl -L "https://archive.org/download/3-d-pinball-for-windows.-7z/3D%20Pinball%20for%20Windows.7z" -o pinball.7z
          7z x pinball.7z -ogame_resources
          rm pinball.7z

      - name: Configure
        run: |
          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEADERBOARD_SECRET="${{ secrets.LEADERBOARD_SECRET }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage site
        run: |
          mkdir -p _site
          cp bin/SpaceCadetPinball.js   _site/
          cp bin/SpaceCadetPinball.wasm _site/
          cp bin/SpaceCadetPinball.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
