services:
  leaderboard:
    build: .
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - leaderboard_data:/data
    environment:
      - LEADERBOARD_SECRET=${LEADERBOARD_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://pinball.coltonspurgin.tech}
      - DB_PATH=/data/leaderboard.db
      - PORT=3456

volumes:
  leaderboard_data:
